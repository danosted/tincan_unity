# TinCan dedicated server. Build the server first (.\.tools\build.ps1), then from this folder:
#   podman compose up --build   (podman compose runs an installed compose provider, today Docker Desktop's docker-compose;
#   without one: podman run -d --name tincan-server -p 7777:7777/udp --restart unless-stopped tincan-server:local)
# Players join with `TinCan.exe -autojoin <this machine's IP>:7777` or the Join menu.
services:
  tincan-server:
    build:
      context: ../../Builds/LinuxServer
      dockerfile: ../../Container/server/Containerfile
    image: tincan-server:local
    ports:
      - "7777:7777/udp"
    restart: unless-stopped
