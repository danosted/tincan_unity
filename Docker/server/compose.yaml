# TinCan dedicated server. Build the server first (.\.tools\build-server.ps1), then from this folder:
#   docker compose up --build
# Players join with `TinCan.exe -autojoin <this machine's IP>:7777` or the Join menu.
services:
  tincan-server:
    build:
      context: ../../Builds/LinuxServer
      dockerfile: ../../Docker/server/Dockerfile
    image: tincan-server:local
    ports:
      - "7777:7777/udp"
    restart: unless-stopped
